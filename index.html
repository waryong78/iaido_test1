<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>거합도 수련관</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #f4f4f4;
      --card: #ffffff;
      --text: #222;
      --accent: #111;
    }

    body.dark {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #f5f5f5;
      --accent: #ffffff;
    }

    body {
      margin: 0;
      font-family: "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: 0.3s;
    }

    /* HEADER */
    header {
      position: relative;
      height: 60vh;
      background: url("iaido_image_01.jpg") center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    header::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
    }

    header .title {
      position: relative;
      z-index: 1;
    }

    header .title h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }

    header .title p {
      font-size: 1.5em;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }

    /* NAV */
    nav {
      background: var(--accent);
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu {
      display: flex;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .hamburger {
      display: none;
      cursor: pointer;
      font-size: 22px;
    }

    .nav-btns {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dark-btn, .lang-btn {
      background: none;
      border: 1px solid white;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .lang-btn {
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    /* SECTIONS */
    section {
      max-width: 1000px;
      margin: 40px auto;
      background: var(--card);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h2 {
      border-left: 5px solid var(--accent);
      padding-left: 10px;
    }

    /* GALLERY */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      border-radius: 10px;
    }

    /* VIDEO */
    iframe {
      width: 100%;
      height: 400px;
      border-radius: 10px;
    }

    /* MAP */
    .map a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #007bff;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .menu {
        display: none;
        flex-direction: column;
        background: #111;
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        padding: 15px;
      }
      .menu.show {
        display: flex;
      }
      .hamburger {
        display: block;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="title">
    <h1 data-ko="○○ 거합도 수련관" data-en="○○ Iaido Dojo">○○ 거합도 수련관</h1>
    <p data-ko="칼과 마음을 하나로" data-en="Sword and Mind as One">칼과 마음을 하나로</p>
  </div>
</header>

<nav>
  <div class="hamburger" onclick="toggleMenu()">☰</div>
  <div class="menu" id="menu">
    <a href="#about" data-ko="거합도" data-en="Iaido">거합도</a>
    <a href="#gallery" data-ko="갤러리" data-en="Gallery">갤러리</a>
    <a href="#video" data-ko="시연 영상" data-en="Demo Video">시연 영상</a>
    <a href="#map" data-ko="오시는 길" data-en="Directions">오시는 길</a>
  </div>
  <div class="nav-btns">
    <button class="lang-btn" onclick="toggleLang()" id="langBtn">EN</button>
    <button class="dark-btn" onclick="toggleDark()">🌙</button>
  </div>
</nav>

<section id="about">
  <h2 data-ko="거합도란?" data-en="What is Iaido?">거합도란?</h2>
  <p data-ko="거합도는 검을 뽑는 순간부터 납도까지의 흐름 속에서 정신과 육체를 함께 수련하는 전통 무도입니다."
     data-en="Iaido is a traditional martial art that trains both mind and body through the flowing movement from drawing the sword to returning it to the scabbard.">
    거합도는 검을 뽑는 순간부터 납도까지의 흐름 속에서
    정신과 육체를 함께 수련하는 전통 무도입니다.
  </p>
</section>

<section id="gallery">
  <h2 data-ko="수련 갤러리" data-en="Training Gallery">수련 갤러리</h2>
  <div class="gallery">
    <img src="Zanchin_01.jpeg">
    <img src="iaido_02.jpeg">
    <img src="Iaido_03.jpeg">
  </div>
</section>

<section id="video">
  <h2 data-ko="시연 영상" data-en="Demo Video">시연 영상</h2>
  <video controls width="100%" height="400px">
    <source src="화면 기록 2026-01-11 오후 2.44.06.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</section>

<section id="map" class="map">
  <h2 data-ko="오시는 길" data-en="Directions">오시는 길</h2>
  <p data-ko="부산 북구 상리로18번길 12" data-en="12 Sangri-ro 18beon-gil, Buk-gu, Busan">부산 북구 상리로18번길 12</p>
  <a href="https://map.kakao.com/link/search/%EB%B6%80%EC%82%B0%20%EB%B6%81%EA%B5%AC%20%EC%83%81%EB%A6%AC%EB%A1%9C18%EB%B2%88%EA%B8%B8%2012" target="_blank"
     data-ko="카카오맵 열기" data-en="Open KakaoMap">카카오맵 열기</a>
  <a href="https://map.naver.com/v5/search/%EB%B6%80%EC%82%B0%20%EB%B6%81%EA%B5%AC%20%EC%83%81%EB%A6%AC%EB%A1%9C18%EB%B2%88%EA%B8%B8%2012" target="_blank"
     data-ko="네이버지도 열기" data-en="Open NaverMap">네이버지도 열기</a>

</section>

<footer>
  <span data-ko="© 2026 ○○ 거합도 수련관" data-en="© 2026 ○○ Iaido Dojo">© 2026 ○○ 거합도 수련관</span>
</footer>

<script>
  // Dark mode
  function toggleDark() {
    document.body.classList.toggle("dark");
    localStorage.setItem("dark", document.body.classList.contains("dark"));
  }

  if (localStorage.getItem("dark") === "true") {
    document.body.classList.add("dark");
  }

  // Menu
  function toggleMenu() {
    document.getElementById("menu").classList.toggle("show");
  }

  // Language toggle
  let currentLang = localStorage.getItem("lang") || "ko";

  function applyLang(lang) {
    document.querySelectorAll("[data-ko]").forEach(el => {
      el.textContent = el.getAttribute("data-" + lang);
    });
    document.getElementById("langBtn").textContent = lang === "ko" ? "EN" : "한글";
    document.documentElement.lang = lang;
  }

  function toggleLang() {
    currentLang = currentLang === "ko" ? "en" : "ko";
    localStorage.setItem("lang", currentLang);
    applyLang(currentLang);
  }

  applyLang(currentLang);

</script>

</body>
</html>
